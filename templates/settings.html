<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 占道经营智能监测系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<style>
    body {
        background-color: #002a54;
        color: white;
    }
</style>
<body>
    <!-- 顶部导航栏 -->
    <nav class="nav-bar">
        <div class="nav-left">
            <img src="{{ url_for('static', filename='images/view7.png') }}" class="left-decoration" alt="装饰图">
        </div>
        <div class="logo">系统设置</div>
        <div class="nav-right">
            <img src="{{ url_for('static', filename='images/view8.png') }}" class="right-decoration" alt="装饰图">
            <button class="logout-btn" onclick="(function() { window.location.href='{{ url_for('logout') }}'; })();">
                <span class="logout-icon">↩</span>
                退出登录
            </button>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <!-- 设置面板 -->
        <div class="settings-panel">
            <!-- 基本设置 -->
            <div class="settings-section">
                <h2>基本设置</h2>
                <div class="setting-item">
                    <label>系统主题</label>
                    <select id="themeSelect">
                        <option value="dark">深色主题</option>
                        <option value="light">浅色主题</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>界面语言</label>
                    <select id="languageSelect">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>

            <!-- 检测设置 -->
            <div class="settings-section">
                <h2>检测设置</h2>
                <div class="setting-item">
                    <label>检测灵敏度</label>
                    <div class="slider-container">
                        <input type="range" id="sensitivitySlider" min="0" max="100" value="75">
                        <span id="sensitivityValue">75%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>最小检测尺寸</label>
                    <div class="slider-container">
                        <input type="range" id="minSizeSlider" min="0" max="100" value="50">
                        <span id="minSizeValue">50%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>启用实时检测</label>
                    <label class="switch">
                        <input type="checkbox" id="realtimeDetection" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <!-- 存储设置 -->
            <div class="settings-section">
                <h2>存储设置</h2>
                <div class="setting-item">
                    <label>自动清理历史记录</label>
                    <select id="cleanupPeriod">
                        <option value="7">7天</option>
                        <option value="30">30天</option>
                        <option value="90">90天</option>
                        <option value="never">永不</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>存储空间使用情况</label>
                    <div class="storage-bar">
                        <div class="storage-used" style="width: 45%;"></div>
                    </div>
                    <span class="storage-info">已使用: 45% (4.5GB/10GB)</span>
                </div>
            </div>

            <!-- 保存按钮 -->
            <div class="settings-actions">
                <button id="saveSettings" class="save-btn">保存设置</button>
                <button id="resetSettings" class="reset-btn">恢复默认</button>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav1">
        {% if is_admin %}
        <a href="{{ url_for('admin_home') }}" class="nav-btn">
        {% else %}
        <a href="{{ url_for('user_home') }}" class="nav-btn">
        {% endif %}
            <span class="btn-icon">🏠</span>
            <span class="btn-text">主界面</span>
        </a>
    </div>
    <div class="bottom-nav2">
        <a href="{{ url_for('analysis') }}" class="nav-btn">
            <span class="btn-icon">📊</span>
            <span class="btn-text">数据分析</span>
        </a>
    </div>
    <div class="bottom-nav3">
        <a href="{{ url_for('monitor') }}" class="nav-btn">
            <span class="btn-icon">📷</span>
            <span class="btn-text">实时监控</span>
        </a>
    </div>
    <div class="bottom-nav4">
        <a href="{{ url_for('history') }}" class="nav-btn">
            <span class="btn-icon">📝</span>
            <span class="btn-text">历史记录</span>
        </a>
    </div>
    <div class="bottom-nav5">
        <a href="{{ url_for('settings') }}" class="nav-btn active">
            <span class="btn-icon">⚙️</span>
            <span class="btn-text">系统设置</span>
        </a>
    </div>
    <div class="bottom-nav6">
        <a href="{{ url_for('about') }}" class="nav-btn">
            <span class="btn-icon">ℹ️</span>
            <span class="btn-text">关于系统</span>
        </a>
    </div>

    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
