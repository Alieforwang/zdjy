<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - 占道经营智能监测系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/analysis.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- 直接使用本地ECharts库 -->
    <script src="{{ url_for('static', filename='js/libs/echarts.min.js') }}"></script>
    <style>
    .result-image {
        max-width: 90%;
        margin-top: 0%;
    }

    .upload-area {
        border: 2px dashed #ccc;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .upload-content {
        width: 100%;
    }

    .preview-container {
        width: 100%;
        margin-bottom: 10px;
    }

    .preview-container img,
    .preview-container video {
        margin: 0 auto;
    }

    .upload-hint {
        transition: opacity 0.3s ease;
    }
    </style>
</head>
<style>
    body {
        background-color: #002a54;
        color: white; /* 确保文本颜色在深色背景上可读 */
    }
</style>
<body>
    <!-- 顶部导航栏 -->
    <nav class="nav-bar">
        <div class="nav-left">
            <img src="{{ url_for('static', filename='images/view7.png') }}" class="left-decoration" alt="装饰图">
        </div>
        <div class="logo">数据分析中心</div>
        <div class="nav-right">
            <img src="{{ url_for('static', filename='images/view8.png') }}" class="right-decoration" alt="装饰图">
            <button class="logout-btn" id="logoutButton">
                <span class="logout-icon">↩</span>
                退出登录
            </button>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <!-- 左侧面板 -->
        <div class="left-panel">
            <!-- 上传分析区域 -->
            <div class="upload-section">
                <h3>上传分析</h3>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-content">
                        <!-- 添加预览区域 -->
                        <div class="preview-container" id="previewContainer" style="display: none;">
                            <img id="imagePreview" style="display: none; max-width: 100%; max-height: 200px;">
                            <video id="videoPreview" 
                                   style="display: none; max-width: 100%; max-height: 200px; background: transparent;" 
                                   controls>
                            </video>
                        </div>
                        <!-- 默认上传提示 -->
                        <div class="upload-hint" id="uploadHint">
                            <span class="upload-icon">📤</span>
                            <p id="uploadText">拖拽文件到此处或点击上传</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*,video/*" hidden>
            </div>

            <!-- 分析结果区域 -->
            <div class="analysis-result">
                <h3>分析结果</h3>
                <div class="result-area" id="resultArea">
                    <div class="empty-result">
                        <span class="empty-icon">📊</span>
                        <p>暂无分析结果</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <!-- 数据概览卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="card-title">今日检测</div>
                    <div class="card-value" id="todayCount">0</div>
                    <div class="card-trend up" id="todayTrend">↑ 0%</div>
                </div>
                <div class="stat-card">
                    <div class="card-title">识别率</div>
                    <div class="card-value" id="processRate">0%</div>
                    <div class="card-trend up" id="processRateTrend">↑ 0%</div>
                </div>
                <div class="stat-card">
                    <div class="card-title">平均响应</div>
                    <div class="card-value" id="avgResponse">0分钟</div>
                    <div class="card-trend" id="avgResponseTrend">--</div>
                </div>
                <div class="stat-card">
                    <div class="card-title">累计处理</div>
                    <div class="card-value" id="totalCount">0</div>
                    <div class="card-trend up" id="totalTrend">↑ 0%</div>
                </div> 
                
            </div>

            <!-- 图表区域 -->
            <div class="charts-container">
                <div class="chart-box">
                    <h3>检测趋势分析</h3>
                    <div id="detectionTrendChart" class="chart"></div>
                </div>
                <div class="chart-box">
                    <h3>检测类型分布</h3>
                    <div id="typeDistributionChart" class="chart"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav1">
        {% if is_admin %}
        <a href="{{ url_for('admin_home') }}" class="nav-btn">
        {% else %}
        <a href="{{ url_for('user_home') }}" class="nav-btn">
        {% endif %}
            <span class="btn-icon">🏠</span>
            <span class="btn-text">主界面</span>
        </a>
    </div>
    <div class="bottom-nav2">
        <a href="{{ url_for('analysis') }}" class="nav-btn active">
            <span class="btn-icon">📊</span>
            <span class="btn-text">数据分析</span>
        </a>
    </div>
    <div class="bottom-nav3">
        <a href="{{ url_for('monitor') }}" class="nav-btn">
            <span class="btn-icon">📷</span>
            <span class="btn-text">实时监控</span>
        </a>
    </div>
    <div class="bottom-nav4">
        <a href="{{ url_for('history') }}" class="nav-btn">
            <span class="btn-icon">📝</span>
            <span class="btn-text">历史记录</span>
        </a>
    </div>
    {% if is_admin %}
    <div class="bottom-nav5">
        <a href="{{ url_for('user_management') }}" class="nav-btn">
            <span class="btn-icon">👥</span>
            <span class="btn-text">用户管理</span>
        </a>
    </div>
    {% endif %}
    <div class="bottom-nav7">
        <a href="{{ url_for('settings') }}" class="nav-btn">
            <span class="btn-icon">⚙️</span>
            <span class="btn-text">系统设置</span>
        </a>
    </div>
    <div class="bottom-nav6">
        <a href="{{ url_for('about') }}" class="nav-btn">
            <span class="btn-icon">ℹ️</span>
            <span class="btn-text">关于系统</span>
        </a>
    </div>
    {% if is_admin %}
    {% endif %}

    <script src="{{ url_for('static', filename='js/analysis.js') }}"></script>
    <script src="{{ url_for('static', filename='js/logout.js') }}"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('页面已加载，事件处理由analysis.js接管');
        
        // 添加登出按钮事件监听器
        document.getElementById('logoutButton').addEventListener('click', function() {
            window.location.href = '{{ url_for('logout') }}';
        });
    });
    </script>
</body>
</html>
