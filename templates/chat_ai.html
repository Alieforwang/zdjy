<script>
// Coze聊天组件
class CozeChat {
    constructor(options = {}) {
        // 默认配置
        this.config = {
            containerId: 'coze-chat',
            apiBase: 'https://api.coze.cn/open_api/v2',
            botId: '7490567895723327497',
            apiToken: 'pat_VVZSSzgJi1O3MY80eoqjD8r71FMO1xlKO7DWiGX8ajbgq2VyEbajSti97p1yfQf6',
            title: '灵瞳——YOLOv8-DeepSeek多模态街景治理实时检测平台智能助手',
            userAvatar: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f464.svg',
            botAvatar: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f916.svg',
            autoTitleEnabled: true, // 是否启用自动标题
            autoTitleMaxMessages: 3, // 更新标题的最大消息数
            ...options
        };
        
        this.currentConversationId = null;
        this.conversations = []; // 存储所有会话
        this.messageHistory = {}; // 存储会话历史消息
        this.messageCounter = {}; // 记录每个会话的消息数
        this.init();
    }
    
    // 初始化组件
    init() {
        // 创建DOM结构
        this.createDOM();
        
        // 加载会话列表和初始化会话ID
        this.loadConversations();
        
        // 加载用户设置
        this.loadSettings();
        
        // 绑定事件
        this.bindEvents();

        // 添加初始欢迎消息
        this.addWelcomeMessage();
    }
    
    // 创建DOM结构
    createDOM() {
        const container = document.getElementById(this.config.containerId);
        if (!container) {
            console.error(`找不到ID为 ${this.config.containerId} 的容器元素`);
            return;
        }
        
        container.innerHTML = `
            <div class="coze-chat-container" id="coze-chat-window">
                <div class="coze-chat-layout">
                    <!-- 侧边栏：会话列表 -->
                    <div class="coze-chat-sidebar" id="coze-chat-sidebar">
                        <div class="coze-chat-sidebar-header">
                            <h3 class="coze-chat-sidebar-title">会话列表</h3>
                            <button class="coze-chat-conversation-action" id="coze-sidebar-close">×</button>
                        </div>
                        <div class="coze-chat-conversation-list" id="coze-conversation-list">
                            <!-- 会话列表项将动态生成 -->
                        </div>
                        <div class="coze-chat-sidebar-footer">
                            <button class="coze-new-conversation-btn" id="coze-new-conversation-btn">
                                <i>+</i> 新建会话
                            </button>
                        </div>
                    </div>
                    
                    <!-- 主内容区 -->
                    <div class="coze-chat-main">
                        <div class="coze-chat-header">

                        <!-- 设置菜单 -->
                        <div class="coze-settings-menu" id="coze-settings-menu">

                            <div class="coze-settings-content">

                                    <label class="coze-settings-label">

                                            <span class="coze-toggle-slider"></span>

                                        <span>AI服务状态：</span>
                                        <span id="coze-service-status-indicator">未知</span>

                <div class="coze-chat-resize-handle-horizontal"></div>
            </div>
            
            <!-- 确认删除对话框 -->
            <div class="coze-dialog-backdrop" id="coze-delete-dialog" style="display: none;">
                <div class="coze-dialog">
                    <div class="coze-dialog-title">确认删除</div>
                    <div class="coze-dialog-content">您确定要删除这个会话吗？此操作无法撤销。</div>
                    <div class="coze-dialog-actions">
                        <button class="coze-dialog-btn coze-dialog-btn-cancel" id="coze-cancel-delete">取消</button>
                        <button class="coze-dialog-btn coze-dialog-btn-confirm" id="coze-confirm-delete">删除</button>

            <!-- 重命名对话框 -->
            <div class="coze-dialog-backdrop" id="coze-rename-dialog" style="display: none;">
                <div class="coze-dialog coze-rename-dialog">
                    <div class="coze-dialog-title">重命名会话</div>
                    <div class="coze-dialog-content coze-rename-dialog-content">

                        <button class="coze-dialog-btn coze-dialog-btn-cancel" id="coze-cancel-rename">取消</button>
                        <button class="coze-dialog-btn" id="coze-confirm-rename" style="background-color: #3a5998; color: white;">确认</button>
                    </div>

            </div>
        `;
        
        // 保存DOM引用
        this.elements = {
            chatWindow: document.getElementById('coze-chat-window'),
            chatBox: document.getElementById('coze-chat-box'),
            userInput: document.getElementById('coze-user-input'),
            sendBtn: document.getElementById('coze-send-btn'),
            loading: document.getElementById('coze-loading'),
            chatIcon: document.getElementById('coze-chat-icon'),
            closeBtn: document.getElementById('coze-chat-close'),
            sidebar: document.getElementById('coze-chat-sidebar'),
            sidebarClose: document.getElementById('coze-sidebar-close'),
            menuToggle: document.getElementById('coze-menu-toggle'),
            conversationList: document.getElementById('coze-conversation-list'),
            newConversationBtn: document.getElementById('coze-new-conversation-btn'),
            currentConversationTitle: document.getElementById('coze-current-conversation-title'),
            deleteDialog: document.getElementById('coze-delete-dialog'),
            confirmDelete: document.getElementById('coze-confirm-delete'),
            cancelDelete: document.getElementById('coze-cancel-delete'),
            renameDialog: document.getElementById('coze-rename-dialog'),
            renameInput: document.getElementById('coze-rename-input'),
            confirmRename: document.getElementById('coze-confirm-rename'),
            cancelRename: document.getElementById('coze-cancel-rename'),
            settingsBtn: document.getElementById('coze-settings-btn'),
            settingsMenu: document.getElementById('coze-settings-menu'),
            autoTitleToggle: document.getElementById('coze-auto-title-toggle')
        };
    }
    
    // 绑定事件
    bindEvents() {
        this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
        this.elements.userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.sendMessage();
        });
        this.elements.chatIcon.addEventListener('click', () => this.toggleChat());
        this.elements.closeBtn.addEventListener('click', () => this.toggleChat());
        
        // 侧边栏切换
        this.elements.menuToggle.addEventListener('click', () => this.toggleSidebar());
        this.elements.sidebarClose.addEventListener('click', () => this.toggleSidebar());
        
        // 新建会话
        this.elements.newConversationBtn.addEventListener('click', () => this.createNewConversation());
        
        // 删除会话对话框
        this.elements.confirmDelete.addEventListener('click', () => this.deleteCurrentConversation());
        this.elements.cancelDelete.addEventListener('click', () => this.hideDeleteDialog());
        
        // 重命名会话对话框
        this.elements.confirmRename.addEventListener('click', () => this.confirmRenameConversation());
        this.elements.cancelRename.addEventListener('click', () => this.hideRenameDialog());
        
        // 设置菜单
        this.elements.settingsBtn.addEventListener('click', () => this.toggleSettingsMenu());
        this.elements.autoTitleToggle.addEventListener('change', (e) => {
            this.config.autoTitleEnabled = e.target.checked;
            // 保存设置到本地存储
            localStorage.setItem('coze_settings', JSON.stringify({
                autoTitleEnabled: this.config.autoTitleEnabled
            }));
        });
        
        // 添加检查服务状态按钮事件
        const checkServiceBtn = document.getElementById('coze-check-service-btn');
        if (checkServiceBtn) {
            checkServiceBtn.addEventListener('click', () => this.checkServiceStatus());
        }
        
        // 点击其他区域关闭设置菜单
        document.addEventListener('click', (e) => {
            if (this.elements.settingsMenu.classList.contains('active') && 
                !this.elements.settingsMenu.contains(e.target) &&
                e.target !== this.elements.settingsBtn) {
                this.elements.settingsMenu.classList.remove('active');
            }
        });
        
        // 添加全屏按钮事件
        const fullscreenBtn = document.getElementById('coze-fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => this.toggleFullscreen());
        
        // 添加调整大小的事件处理
        const resizeHandle = this.elements.chatWindow.querySelector('.coze-chat-resize-handle');
        const resizeHandleHorizontal = this.elements.chatWindow.querySelector('.coze-chat-resize-handle-horizontal');
        let startX, startY, startWidth, startHeight;
        
        // 处理右下角调整
        resizeHandle.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
            startWidth = this.elements.chatWindow.offsetWidth;
            startHeight = this.elements.chatWindow.offsetHeight;
            
            const mouseMoveHandler = (e) => {
                const newWidth = startWidth + (e.clientX - startX);
                const newHeight = startHeight + (e.clientY - startY);
                
                if (newWidth >= 300 && newWidth <= 600) {
                    this.elements.chatWindow.style.width = newWidth + 'px';
                }
                if (newHeight >= 400 && newHeight <= window.innerHeight * 0.9) {
                    this.elements.chatWindow.style.height = newHeight + 'px';
                }
            };
            
            const mouseUpHandler = () => {
                document.removeEventListener('mousemove', mouseMoveHandler);
                document.removeEventListener('mouseup', mouseUpHandler);
            };
            
            document.addEventListener('mousemove', mouseMoveHandler);
            document.addEventListener('mouseup', mouseUpHandler);
        });
        
        // 处理右侧调整
        resizeHandleHorizontal.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            startWidth = this.elements.chatWindow.offsetWidth;
            
            const mouseMoveHandler = (e) => {
                const newWidth = startWidth + (e.clientX - startX);
                if (newWidth >= 300 && newWidth <= 600) {
                    this.elements.chatWindow.style.width = newWidth + 'px';
                }
            };
            
            const mouseUpHandler = () => {
                document.removeEventListener('mousemove', mouseMoveHandler);
                document.removeEventListener('mouseup', mouseUpHandler);
            };
            
            document.addEventListener('mousemove', mouseMoveHandler);
            document.addEventListener('mouseup', mouseUpHandler);
        });
    }

    // 切换侧边栏
    toggleSidebar() {
        this.elements.sidebar.classList.toggle('active');
        
        // 在小屏幕上，如果侧边栏激活，则将其置于顶层
        if (window.innerWidth <= 600) {
            if (this.elements.sidebar.classList.contains('active')) {
                this.elements.sidebar.style.zIndex = '20';
            } else {
                // 延迟将zIndex恢复，以便过渡效果完成
                setTimeout(() => {
                    this.elements.sidebar.style.zIndex = '10';
                }, 300);
            }
        }
    }
    
    // 加载会话列表
    loadConversations() {
        // 从本地存储加载会话列表
        const savedConversations = localStorage.getItem('coze_conversations');
        if (savedConversations) {
            this.conversations = JSON.parse(savedConversations);
        }
        
        // 如果没有会话，创建一个默认会话
        if (this.conversations.length === 0) {
            const defaultConversation = {
                id: "conv_" + Date.now(),
                title: "新会话",
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            
            this.conversations.push(defaultConversation);
            this.saveConversations();
        }
        
        // 初始化当前会话
        const lastConversationId = localStorage.getItem('coze_current_conversation_id');
        if (lastConversationId) {
            // 检查保存的会话ID是否存在于会话列表中
            const conversationExists = this.conversations.some(conv => conv.id === lastConversationId);
            if (conversationExists) {
                this.currentConversationId = lastConversationId;
            } else {
                // 如果不存在，使用第一个会话
                this.currentConversationId = this.conversations[0].id;
            }
        } else {
            // 如果没有保存的会话ID，使用第一个会话
            this.currentConversationId = this.conversations[0].id;
        }
        
        // 持久化当前会话ID
        this.persistCurrentConversationId();
        
        // 渲染会话列表
        this.renderConversationList();
        
        // 加载会话历史消息
        this.loadConversationMessages();
    }
    
    // 保存会话列表到本地存储
    saveConversations() {
        localStorage.setItem('coze_conversations', JSON.stringify(this.conversations));
    }
    
    // 持久化当前会话ID
    persistCurrentConversationId() {
        localStorage.setItem('coze_current_conversation_id', this.currentConversationId);
    }
    
    // 渲染会话列表
    renderConversationList() {
        this.elements.conversationList.innerHTML = '';
        
        this.conversations.forEach(conversation => {
            const isActive = conversation.id === this.currentConversationId;
            const date = new Date(conversation.updatedAt);
            const formattedDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
            
            const conversationItem = document.createElement('div');
            conversationItem.className = `coze-chat-conversation-item ${isActive ? 'active' : ''}`;
            conversationItem.setAttribute('data-id', conversation.id);
            
            conversationItem.innerHTML = `
                <div class="coze-chat-conversation-info">
                    <div class="coze-chat-conversation-title">${conversation.title}</div>
                    <div class="coze-chat-conversation-date">${formattedDate}</div>
                </div>
                <div class="coze-chat-conversation-actions">
                    <button class="coze-chat-conversation-action coze-rename-btn" title="重命名">✎</button>
                    <button class="coze-chat-conversation-action coze-delete-btn" title="删除">🗑</button>
                </div>
            `;
            
            // 添加点击事件，切换会话
            conversationItem.addEventListener('click', (e) => {
                // 如果点击的是操作按钮，不进行会话切换
                if (e.target.classList.contains('coze-chat-conversation-action')) {
                    return;
                }
                
                this.switchConversation(conversation.id);
            });
            
            // 添加重命名按钮事件
            const renameBtn = conversationItem.querySelector('.coze-rename-btn');
            renameBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止冒泡，防止触发父元素的点击事件
                this.showRenameDialog(conversation.id);
            });
            
            // 添加删除按钮事件
            const deleteBtn = conversationItem.querySelector('.coze-delete-btn');
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止冒泡，防止触发父元素的点击事件
                this.showDeleteDialog(conversation.id);
            });
            
            this.elements.conversationList.appendChild(conversationItem);
        });
        
        // 更新当前会话标题
        this.updateCurrentConversationTitle();
    }
    
    // 更新当前会话标题
    updateCurrentConversationTitle() {
        const currentConversation = this.conversations.find(conv => conv.id === this.currentConversationId);
        if (currentConversation) {
            this.elements.currentConversationTitle.textContent = currentConversation.title;
        }
    }
    
    // 创建新会话
    createNewConversation() {
        // 创建新会话对象
        const newConversation = {
            id: "conv_" + Date.now(),
            title: "新会话",
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
        
        // 添加到会话列表
        this.conversations.unshift(newConversation);
        
        // 保存会话列表
        this.saveConversations();
        
        // 切换到新会话
        this.switchConversation(newConversation.id);
        
        // 在小屏幕上自动关闭侧边栏
        if (window.innerWidth <= 600) {
            this.toggleSidebar();
        }
    }
    
    // 切换会话
    switchConversation(conversationId) {
        // 保存当前会话的消息
        this.saveConversationMessages();
        
        // 更新当前会话ID
        this.currentConversationId = conversationId;
        
        // 持久化当前会话ID
        this.persistCurrentConversationId();
        
        // 更新会话列表中的活动状态
        this.renderConversationList();
        
        // 加载新会话的消息
        this.loadConversationMessages();
        
        // 在小屏幕上自动关闭侧边栏
        if (window.innerWidth <= 600) {
            this.toggleSidebar();
        }
    }
    
    // 保存会话消息
    saveConversationMessages() {
        // 保存当前会话的消息
        this.messageHistory[this.currentConversationId] = this.elements.chatBox.innerHTML;
        
        // 保存到localStorage
        localStorage.setItem('coze_message_history', JSON.stringify(this.messageHistory));
    }
    
    // 加载会话消息
    loadConversationMessages() {
        // 从localStorage加载所有会话的消息历史
        const savedMessageHistory = localStorage.getItem('coze_message_history');
        if (savedMessageHistory) {
            this.messageHistory = JSON.parse(savedMessageHistory);
        }
        
        // 清空当前消息框
        this.elements.chatBox.innerHTML = '';
        
        // 加载当前会话的消息
        if (this.messageHistory[this.currentConversationId]) {
            this.elements.chatBox.innerHTML = this.messageHistory[this.currentConversationId];
        } else {
            // 如果是新会话，显示欢迎消息
            this.addWelcomeMessage();
        }
        
        // 滚动到底部
        this.scrollToBottom();
    }
    
    // 显示删除会话对话框
    showDeleteDialog(conversationId) {
        // 如果只有一个会话，不允许删除
        if (this.conversations.length <= 1) {
            alert('无法删除最后一个会话');
            return;
        }
        
        // 设置要删除的会话ID
        this.conversationToDelete = conversationId;
        
        // 显示确认对话框
        this.elements.deleteDialog.style.display = 'flex';
    }
    
    // 隐藏删除会话对话框
    hideDeleteDialog() {
        this.elements.deleteDialog.style.display = 'none';
        this.conversationToDelete = null;
    }
    
    // 删除当前会话
    deleteCurrentConversation() {
        if (!this.conversationToDelete) return;
        
        // 找到要删除的会话索引
        const index = this.conversations.findIndex(conv => conv.id === this.conversationToDelete);
        
        if (index !== -1) {
            // 删除会话
            this.conversations.splice(index, 1);
            
            // 删除会话消息
            delete this.messageHistory[this.conversationToDelete];
            localStorage.setItem('coze_message_history', JSON.stringify(this.messageHistory));
            
            // 如果删除的是当前会话，切换到第一个会话
            if (this.conversationToDelete === this.currentConversationId) {
                this.currentConversationId = this.conversations[0].id;
                this.persistCurrentConversationId();
                this.loadConversationMessages();
            }
            
            // 保存会话列表
            this.saveConversations();
            
            // 重新渲染会话列表
            this.renderConversationList();
        }
        
        // 隐藏对话框
        this.hideDeleteDialog();
    }
    
    // 显示重命名对话框
    showRenameDialog(conversationId) {
        // 找到要重命名的会话
        const conversation = this.conversations.find(conv => conv.id === conversationId);
        
        if (conversation) {
            // 设置要重命名的会话ID和当前名称
            this.conversationToRename = conversationId;
            this.elements.renameInput.value = conversation.title;
            
            // 显示重命名对话框
            this.elements.renameDialog.style.display = 'flex';
            
            // 焦点到输入框
            setTimeout(() => {
                this.elements.renameInput.focus();
                this.elements.renameInput.select();
            }, 100);
        }
    }
    
    // 隐藏重命名对话框
    hideRenameDialog() {
        this.elements.renameDialog.style.display = 'none';
        this.conversationToRename = null;
    }
    
    // 确认重命名会话
    confirmRenameConversation() {
        if (!this.conversationToRename) return;
        
        const newTitle = this.elements.renameInput.value.trim();
        if (!newTitle) {
            alert('会话名称不能为空');
            return;
        }
        
        // 找到要重命名的会话
        const conversation = this.conversations.find(conv => conv.id === this.conversationToRename);
        
        if (conversation) {
            // 更新会话标题
            conversation.title = newTitle;
            conversation.updatedAt = new Date().toISOString();
            
            // 保存会话列表
            this.saveConversations();
            
            // 重新渲染会话列表
            this.renderConversationList();
            
            // 如果是当前会话，更新标题显示
            if (this.conversationToRename === this.currentConversationId) {
                this.updateCurrentConversationTitle();
            }
        }
        
        // 隐藏对话框
        this.hideRenameDialog();
    }

    // 切换聊天窗口显示状态
    toggleChat() {
        if (this.elements.chatWindow.style.display === 'none' || !this.elements.chatWindow.style.display) {
            this.elements.chatWindow.style.display = 'block';
        } else {
            this.elements.chatWindow.style.display = 'none';
        }
    }
    
    // 添加欢迎消息
    addWelcomeMessage() {
        // 首先检查是否已经有欢迎消息
        const welcomeMessages = this.elements.chatBox.querySelectorAll('.coze-chat-bot-message');
        let hasWelcomeMessage = false;
        
        if (welcomeMessages.length > 0) {
            // 检查第一条消息是否包含欢迎信息关键词
            const firstMessage = welcomeMessages[0];
            const messageContent = firstMessage.querySelector('.coze-message-content').textContent || '';
            
            if (messageContent.includes('欢迎使用灵瞳') || 
                messageContent.includes('YOLOv8-DeepSeek多模态街景治理实时检测平台')) {
                hasWelcomeMessage = true;
            }
        }
        
        // 如果已经有欢迎消息，就不再添加
        if (hasWelcomeMessage) {
            return;
        }
        
        const welcomeMessage = `
欢迎使用灵瞳——YOLOv8-DeepSeek多模态街景治理实时检测平台！我是您的专属智能顾问。如需以下方面的帮助，请随时咨询：

1. 系统功能模块解析
2. 实时数据分析方法
3. 智能预警机制说明
4. 设备运维指导建议
5. 识别算法优化方案
        `;
        
        this.elements.chatBox.innerHTML += `
            <div class="coze-chat-message coze-chat-bot-message">
                <img src="${this.config.botAvatar}" class="coze-avatar" alt="AI">
                <div class="coze-message-content">
                    ${welcomeMessage.replace(/\n/g, '<br>')}
                </div>
            </div>`;
            
        // 保存欢迎消息
        this.saveConversationMessages();
    }
    
    // 发送消息
    async sendMessage() {
        const message = this.elements.userInput.value.trim();
        if (!message) return;
        
        // 显示用户消息 - 移除"您:"前缀
        this.elements.chatBox.innerHTML += `
            <div class="coze-chat-message coze-chat-user-message">
                <img src="${this.config.userAvatar}" class="coze-avatar" alt="User">
                <div class="coze-message-content">
                    ${message}
                </div>
            </div>`;
        
        // 更新消息计数器
        if (!this.messageCounter[this.currentConversationId]) {
            this.messageCounter[this.currentConversationId] = 0;
        }
        this.messageCounter[this.currentConversationId]++;
        
        // 检查是否需要更新会话标题
        const currentConversation = this.conversations.find(conv => conv.id === this.currentConversationId);
        const messageCount = this.messageCounter[this.currentConversationId];
        const shouldUpdateTitle = this.config.autoTitleEnabled && 
                                 currentConversation && 
                                 (currentConversation.title === "新会话" || messageCount <= this.config.autoTitleMaxMessages);
        
        this.elements.userInput.value = '';
        this.elements.sendBtn.disabled = true;
        
        // 滚动到底部
        this.scrollToBottom();
        
        // 创建新的回复消息元素
        const messageDiv = document.createElement('div');
        messageDiv.className = 'coze-chat-message coze-chat-bot-message';
        
        messageDiv.innerHTML = `
            <img src="${this.config.botAvatar}" class="coze-avatar" alt="AI">
            <div class="coze-message-content">
                <span class="ai-response"></span>
            </div>
        `;
        
        this.elements.chatBox.appendChild(messageDiv);
        
        // 获取AI回复内容容器
        const responseElement = messageDiv.querySelector('.ai-response');
        
        // 初始显示思考动画
        responseElement.innerHTML = `
            <div class="coze-thinking">
                正在分析
                <span></span>
            </div>
        `;
        
        // 滚动到底部
        this.scrollToBottom();
        
        // 保存当前的消息状态
        this.saveConversationMessages();
        
        let fullAnswer = "";
        let newConversationId = null;
        
        try {
            // 构造请求体 - 保持会话ID一致性
            const payload = {
                "conversation_id": this.currentConversationId || "new",
                "query": message,
                "debug": true // 添加调试标志
            };
            
            console.log("发送聊天请求:", payload);
            
            // 使用fetch API的流式功能
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            
            console.log("聊天响应状态:", response.status);
            
            // 检查响应状态
            if (!response.ok) {
                throw new Error(`服务器返回错误状态码: ${response.status}`);
            }
            
            // 创建响应读取器并处理流式响应
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = "";
            
            // 移除思考动画
            responseElement.innerHTML = '';
            
            const processStream = async () => {
                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        
                        if (done) {
                            console.log("流读取完成");
                            break;
                        }
                        
                        // 解码二进制数据
                        const text = decoder.decode(value, { stream: true });
                        buffer += text;
                        
                        // 寻找完整的事件数据块
                        const lines = buffer.split('\n\n');
                        buffer = lines.pop() || ''; // 保留最后一个不完整的块
                        
                        for (const line of lines) {
                            if (line.trim()) {
                                try {
                                    const eventData = JSON.parse(line);
                                    
                                    if (eventData.event === 'chunk') {
                                        // 处理文本块
                                        const chunk = eventData.data.text;
                                        fullAnswer += chunk;
                                        
                                        // 直接添加文本到响应元素
                                        this.appendTextToElement(responseElement, chunk);
                                        
                                        // 滚动到底部
                                        this.scrollToBottom();
                                    } 
                                    else if (eventData.event === 'done') {
                                        // 处理完成事件
                                        console.log("回答完成:", eventData.data);
                                        
                                        // 更新会话ID
                                        if (eventData.data.conversation_id) {
                                            newConversationId = eventData.data.conversation_id;
                                            
                                            // 更新当前会话ID
                                            if (newConversationId && newConversationId !== this.currentConversationId) {
                                                console.log(`更新会话ID: ${this.currentConversationId} -> ${newConversationId}`);
                                                this.currentConversationId = newConversationId;
                                                this.persistCurrentConversationId();
                                            }
                                        }
                                    }
                                } catch (e) {
                                    console.error("解析事件数据失败:", e, line);
                                }
                            }
                        }
                    }
                    
                    // 保存消息
                    this.saveConversationMessages();
                    
                    // 如果需要更新标题，在获得 AI 回复后尝试自动生成标题
                    if (shouldUpdateTitle) {
                        this.generateConversationTitle();
                    }
                    
                    // 更新会话更新时间
                    this.updateConversationTimestamp();
                    
                } catch (error) {
                    console.error("读取流时出错:", error);
                    responseElement.innerHTML += `<br><span style="color: red;">读取回答时出错: ${error.message}</span>`;
                    this.saveConversationMessages();
                }
            };
            
            await processStream();
            
        } catch (error) {
            console.error('请求失败:', error);
            
            // 显示错误
            this.elements.chatBox.innerHTML += `
                <div class="coze-chat-message coze-chat-bot-message coze-chat-error">
                    <img src="${this.config.botAvatar}" class="coze-avatar" alt="AI">
                    <div class="coze-message-content">
                        无法检查AI服务状态: ${error.message}
                    </div>
                </div>`;
            
            // 清除思考动画
            responseElement.innerHTML = `<span style="color: red;">错误: ${error.message}</span>`;
            
            // 保存消息
            this.saveConversationMessages();
        } finally {
            this.elements.sendBtn.disabled = false;
            this.elements.loading.style.display = 'none';
            this.scrollToBottom();
        }
    }
    
    // 添加一个方法用于安全地向元素追加文本
    appendTextToElement(element, text) {
        // 处理换行符，转换为<br>标签
        const htmlText = text.replace(/\n/g, '<br>');
        
        // 创建一个安全的方式添加HTML
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlText;
        
        // 或者使用innerHTML直接追加
        if (element.innerHTML.includes('coze-thinking')) {
            element.innerHTML = htmlText;
        } else {
            element.innerHTML += htmlText;
        }
    }

    // 更新会话时间戳
    updateConversationTimestamp() {
        // 找到当前会话
        const conversation = this.conversations.find(conv => conv.id === this.currentConversationId);
        
        if (conversation) {
            // 更新时间戳
            conversation.updatedAt = new Date().toISOString();
            
            // 保存会话列表
            this.saveConversations();
            
            // 重新渲染会话列表
            this.renderConversationList();
        }
    }

    // 滚动到底部的方法
    scrollToBottom() {
        // 使用平滑滚动
        this.elements.chatBox.scrollTo({
            top: this.elements.chatBox.scrollHeight,
            behavior: 'smooth'
        });
    }

    // 发送建议的问题
    sendSuggestedQuestion(question) {
        this.elements.userInput.value = question;
        this.sendMessage();
    }

    // 添加全屏切换方法
    toggleFullscreen() {
        const chatWindow = this.elements.chatWindow;
        chatWindow.classList.toggle('fullscreen');
        
        // 更新全屏按钮图标
        const fullscreenBtn = document.getElementById('coze-fullscreen-btn');
        if (chatWindow.classList.contains('fullscreen')) {
            fullscreenBtn.textContent = '⛶';
            fullscreenBtn.title = '退出全屏';
        } else {
            fullscreenBtn.textContent = '⛶';
            fullscreenBtn.title = '全屏';
        }
    }

    // 切换设置菜单
    toggleSettingsMenu() {
        this.elements.settingsMenu.classList.toggle('active');
    }
    
    // 加载设置
    loadSettings() {
        const savedSettings = localStorage.getItem('coze_settings');
        if (savedSettings) {
            const settings = JSON.parse(savedSettings);
            
            // 更新配置
            if (settings.hasOwnProperty('autoTitleEnabled')) {
                this.config.autoTitleEnabled = settings.autoTitleEnabled;
                this.elements.autoTitleToggle.checked = settings.autoTitleEnabled;
            }
        }
    }

    // 添加检查服务状态的方法
    async checkServiceStatus() {
        const statusIndicator = document.getElementById('coze-service-status-indicator');
        if (!statusIndicator) return;
        
        // 更新状态指示器
        statusIndicator.className = 'coze-status-unknown';
        statusIndicator.textContent = '检查中...';
        
        try {
            const response = await fetch('/api/chat/status');
            const result = await response.json();
            
            console.log("服务状态检查结果:", result);
            
            // 根据响应更新状态指示器
            if (result.status === 'available') {
                statusIndicator.className = 'coze-status-available';
                statusIndicator.textContent = '可用';
            } else if (result.status === 'unavailable' || result.status === 'timeout') {
                statusIndicator.className = 'coze-status-unavailable';
                statusIndicator.textContent = '不可用';
                
                // 显示详细错误
                this.elements.chatBox.innerHTML += `
                    <div class="coze-chat-message coze-chat-bot-message coze-chat-error">
                        <img src="${this.config.botAvatar}" class="coze-avatar" alt="AI">
                        <div class="coze-message-content">
                            AI服务状态检查: ${result.message}
                            <br>服务地址: ${result.url}
                        </div>
                    </div>`;
                
                // 保存消息
                this.saveConversationMessages();
                
                // 滚动到底部
                this.scrollToBottom();
            } else {
                statusIndicator.className = 'coze-status-error';
                statusIndicator.textContent = '错误';
                
                // 显示详细错误
                this.elements.chatBox.innerHTML += `
                    <div class="coze-chat-message coze-chat-bot-message coze-chat-error">
                        <img src="${this.config.botAvatar}" class="coze-avatar" alt="AI">
                        <div class="coze-message-content">
                            AI服务状态检查: ${result.message}
                            <br>服务地址: ${result.url}
                        </div>
                    </div>`;
                
                // 保存消息
                this.saveConversationMessages();
                
                // 滚动到底部
                this.scrollToBottom();
            }
        } catch (error) {
            console.error("检查服务状态时出错:", error);
            statusIndicator.className = 'coze-status-error';
            statusIndicator.textContent = '检查失败';
            
            // 显示错误
            this.elements.chatBox.innerHTML += `
                <div class="coze-chat-message coze-chat-bot-message coze-chat-error">
                    <img src="${this.config.botAvatar}" class="coze-avatar" alt="AI">
                    <div class="coze-message-content">
                        无法检查AI服务状态: ${error.message}
                    </div>
                </div>`;
            
            // 保存消息
            this.saveConversationMessages();
            
            // 滚动到底部
            this.scrollToBottom();
        }
    }

    // 添加自动生成会话标题的方法
    async generateConversationTitle() {
        try {
            // 获取当前会话的消息
            const chatBox = this.elements.chatBox;
            if (!chatBox) return;
            
            // 解析会话内容
            const messages = [];
            const messageElements = chatBox.querySelectorAll('.coze-chat-message');
            
            // 提取最多5条消息
            let count = 0;
            for (const msgElement of messageElements) {
                if (count >= 5) break;
                
                const content = msgElement.querySelector('.coze-message-content').textContent.trim();
                const role = msgElement.classList.contains('coze-chat-user-message') ? 'user' : 'assistant';
                
                messages.push({
                    role,
                    content
                });
                
                count++;
            }
            
            // 如果没有消息，不进行标题生成
            if (messages.length === 0) return;
            
            console.log("发送标题生成请求:", { messages });
            
            // 调用标题生成API
            const response = await fetch('/api/generate_title', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ messages })
            });
            
            if (!response.ok) {
                throw new Error('标题生成失败');
            }
            
            const result = await response.json();
            const title = result.title;
            
            if (title) {
                console.log("生成标题:", title);
                
                // 更新当前会话标题
                const conversation = this.conversations.find(conv => conv.id === this.currentConversationId);
                if (conversation && conversation.title === "新会话") {
                    conversation.title = title;
                    
                    // 更新界面显示
                    this.elements.currentConversationTitle.textContent = title;
                    
                    // 保存会话列表
                    this.saveConversations();
                    
                    // 重新渲染会话列表
                    this.renderConversationList();
                }
            }
            
        } catch (error) {
            console.error("生成标题时出错:", error);
        }
    }
}
