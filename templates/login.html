<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵瞳-城市治理智能感知终端</title>
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <script>
        // 粒子系统
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置canvas尺寸
        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // 粒子类
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 3 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        // 创建粒子数组
        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        // 连线函数
        function drawLines() {
            ctx.lineWidth = 2;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 200) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 - distance/200 * 0.3})`;
                        ctx.stroke();
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            drawLines();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
    <div class="main-content">
        <div class="left-content">
            <h1>灵瞳-城市治理智能感知终端</h1>
            <p class="subtitle">科技赋能城市管理，智慧提升治理效能</p>
            
            <div class="feature-list">
                <div class="feature-item">
                    <span class="icon">📍</span>
                    <span>全方位监测分析，尽在掌控</span>
                </div>
                <div class="feature-item">
                    <span class="icon">📊</span>
                    <span>智能数据分析，助力决策</span>
                </div>
                <div class="feature-item">
                    <span class="icon">👥</span>
                    <span>便捷的用户管理，高效服务</span>
                </div>
            </div>
        </div>

        <div class="content-separator">
            <div class="separator-line"></div>
            <div class="separator-circle">
                <span class="separator-icon"></span>
            </div>
            <div class="separator-line"></div>
        </div>

        <div class="login-container">
            <div class="login-box">
                <div class="login-tabs">
                    <button class="tab-btn active" onclick="switchTab('admin')">管理员登录</button>
                    <button class="tab-btn" onclick="switchTab('user')">用户登录</button>
                </div>
                
                <!-- 管理员登录表单 -->
                <div id="adminLogin" class="login-form active">
                    <h2>管理员登录</h2>
                    <p class="login-desc">请输入您的账号和密码</p>
                    <form>
                        <div class="input-group">
                            <input type="text" id="adminUsername" name="username" placeholder="用户名" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="adminPassword" name="password" placeholder="密码" required>
                        </div>
                        <button type="submit">登 录</button>
                    </form>
                </div>

                <!-- 用户登录表单 -->
                <div id="userLogin" class="login-form">
                    <div class="user-tabs">
                        <button class="user-tab-btn active" onclick="switchUserTab('login')">登录</button>
                        <button class="user-tab-btn" onclick="switchUserTab('register')">注册</button>
                    </div>
                    
                    <!-- 用户登录面板 -->
                    <div id="userLoginPanel" class="user-panel active">
                        <p class="login-desc">请输入您的账号和密码</p>
                        <form>
                            <div class="input-group">
                                <input type="text" id="userUsername" name="username" placeholder="用户名" required>
                            </div>
                            <div class="input-group">
                                <input type="password" id="userPassword" name="password" placeholder="密码" required>
                            </div>
                            <button type="submit">登 录</button>
                        </form>
                    </div>

                    <!-- 用户注册面板 -->
                    <div id="userRegisterPanel" class="user-panel">
                        <p class="login-desc">请填写注册信息</p>
                        <form>
                            <div class="input-group">
                                <input type="text" id="regUsername" name="username" placeholder="用户名" required>
                            </div>
                            <div class="input-group">
                                <input type="password" id="regPassword" name="password" placeholder="密码" required>
                            </div>
                            <div class="input-group">
                                <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="确认密码" required>
                            </div>
                            <div class="input-group">
                                <input type="tel" id="regPhone" name="phone" placeholder="手机号码" required>
                            </div>
                            <button type="submit">注 册</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <span>Version 1.4.0</span>
        <span class="separator">|</span>
        <span>汪志胜、翟玉虎提供技术支持</span>
    </div>

    <script>
        // 切换管理员和用户登录tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Login').classList.add('active');
        }

        // 切换用户登录和注册tabs
        function switchUserTab(tab) {
            document.querySelectorAll('.user-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.user-panel').forEach(panel => panel.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('user' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Panel').classList.add('active');
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 管理员登录表单提交
            document.querySelector('#adminLogin form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('adminUsername').value;
                const password = document.getElementById('adminPassword').value;
                
                if (!username || !password) {
                    alert('用户名和密码不能为空');
                    return;
                }
                
                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        isAdmin: true
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/';
                    } else {
                        alert(data.message || '登录失败，请检查用户名和密码');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('登录过程出错，请重试');
                });
            });

            // 用户登录表单提交
            document.querySelector('#userLoginPanel form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('userUsername').value;
                const password = document.getElementById('userPassword').value;
                
                if (!username || !password) {
                    alert('用户名和密码不能为空');
                    return;
                }
                
                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        isAdmin: false
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        alert(data.message || '登录失败，请检查用户名和密码');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('登录过程出错，请重试');
                });
            });

            // 用户注册表单提交
            document.querySelector('#userRegisterPanel form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                const phone = document.getElementById('regPhone').value;
                
                if (!username || !password || !confirmPassword || !phone) {
                    alert('请填写所有必填项');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }
                
                fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        phone: phone
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('注册成功，请登录');
                        switchUserTab('login');
                        document.getElementById('userUsername').value = username;
                    } else {
                        alert(data.message || '注册失败');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('注册过程出错，请重试');
                });
            });
        });
    </script>
</body>
</html>
