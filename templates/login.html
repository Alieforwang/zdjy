<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵瞳——YOLOv8-DeepSeek多模态街景治理实时检测平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <!-- 页面预加载脚本，需要最先加载 -->
    <script src="{{ url_for('static', filename='js/page-transition.js') }}"></script>
    <style>
        /* 科技感过渡动画 */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        @keyframes slideInFromLeft {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideInFromRight {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        
        @keyframes glitch {
            0% { clip-path: inset(0 0 0 0); }
            5% { clip-path: inset(20% 0 0 0); }
            10% { clip-path: inset(0 10% 0 0); }
            15% { clip-path: inset(0 0 10% 0); }
            20% { clip-path: inset(0 0 0 10%); }
            25% { clip-path: inset(0 0 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }
        
        /* 基础样式设置 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background-image: url("{{ url_for('static', filename='images/background.jpg') }}");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        
        /* 背景遮罩 */
        .background-overlay {
            display: none; /* 移除遮罩层 */
        }
        
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: transparent;
        }
        
        .main-content {
            position: relative;
            z-index: 2;
        }
        
        /* 扫描线效果 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to bottom, 
                rgba(124, 255, 178, 0), 
                rgba(124, 255, 178, 0.5) 50%, 
                rgba(124, 255, 178, 0));
            z-index: 5;  /* 扫描线在最上层 */
            pointer-events: none;
            animation: scanline 4s linear infinite;
        }
        
        /* 科技风格边框 */
        .tech-border {
            border: 1px solid rgba(124, 255, 178, 0.3);
            box-shadow: 0 0 15px rgba(124, 255, 178, 0.2);
            transition: all 0.3s ease;
        }
        
        .tech-border:hover {
            border-color: rgba(124, 255, 178, 0.8);
            box-shadow: 0 0 25px rgba(124, 255, 178, 0.4);
        }
        
        /* 登录框增强 */
        .login-box {
            animation: fadeIn 1s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-box::before, .login-box::after {
            content: '';
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(124, 255, 178, 0.5), transparent);
            width: 200%;
            height: 2px;
        }
        
        .login-box::before {
            top: 0;
            left: -100%;
            animation: techLineAnimateX 8s linear infinite;
        }
        
        .login-box::after {
            bottom: 0;
            right: -100%;
            animation: techLineAnimateX 8s linear 4s infinite;
        }
        
        @keyframes techLineAnimateX {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
        
        .login-tabs .tab-btn {
            transition: all 0.3s ease;
        }
        
        .login-tabs .tab-btn.active {
            box-shadow: 0 0 10px rgba(124, 255, 178, 0.5);
        }
        
        .input-group input {
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            border-color: rgba(124, 255, 178, 0.8);
            box-shadow: 0 0 10px rgba(124, 255, 178, 0.3);
        }
        
        .left-content {
            animation: slideInFromLeft 1s ease;
        }
        
        .login-container {
            animation: slideInFromRight 1s ease;
        }
        
        h1, .subtitle {
            animation: pulse 4s ease infinite;
        }
        
        /* 增加微弱的故障效果 */
        h1:hover {
            animation: glitch 1s linear;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="main-content">
        <div class="left-content">
            <h1>灵瞳——YOLOv8-DeepSeek多模态街景治理实时检测平台</h1>
            <p class="subtitle">科技赋能城市管理，智慧提升治理效能</p>
            
            <div class="feature-list">
                <div class="feature-item">
                    <span class="icon">📍</span>
                    <span>全方位监测分析，尽在掌控</span>
                </div>
                <div class="feature-item">
                    <span class="icon">📊</span>
                    <span>智能数据分析，助力决策</span>
                </div>
                <div class="feature-item">
                    <span class="icon">👥</span>
                    <span>便捷的用户管理，高效服务</span>
                </div>
            </div>
        </div>

        <div class="content-separator">
            <div class="separator-line"></div>
            <div class="separator-circle">
                <span class="separator-icon"></span>
            </div>
            <div class="separator-line"></div>
        </div>

        <div class="login-container">
            <div class="login-box tech-border">
                <div class="login-tabs">
                    <button class="tab-btn active" onclick="switchTab('admin')">管理员登录</button>
                    <!-- <button class="tab-btn" onclick="switchTab('user')">用户登录</button> -->
                </div>
                
                <!-- 管理员登录表单 -->
                <div id="adminLogin" class="login-form active">
                    <h2>管理员登录</h2>
                    <p class="login-desc">请输入您的账号和密码</p>
                    <form>
                        <div class="input-group">
                            <input type="text" id="adminUsername" name="username" placeholder="用户名" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="adminPassword" name="password" placeholder="密码" required>
                        </div>
                        <button type="submit">登 录</button>
                    </form>
                </div>

                <!-- 用户登录表单 -->
                <div id="userLogin" class="login-form">
                    <div class="user-tabs">
                        <button class="user-tab-btn active" onclick="switchUserTab('login')">登录</button>
                        <button class="user-tab-btn" onclick="switchUserTab('register')">注册</button>
                    </div>
                    
                    <!-- 用户登录面板 -->
                    <div id="userLoginPanel" class="user-panel active">
                        <p class="login-desc">请输入您的账号和密码</p>
                        <form>
                            <div class="input-group">
                                <input type="text" id="userUsername" name="username" placeholder="用户名" required>
                            </div>
                            <div class="input-group">
                                <input type="password" id="userPassword" name="password" placeholder="密码" required>
                            </div>
                            <button type="submit">登 录</button>
                        </form>
                    </div>

                    <!-- 用户注册面板 -->
                    <div id="userRegisterPanel" class="user-panel">
                        <p class="login-desc">请填写注册信息</p>
                        <form>
                            <div class="input-group">
                                <input type="text" id="regUsername" name="username" placeholder="用户名" required>
                            </div>
                            <div class="input-group">
                                <input type="password" id="regPassword" name="password" placeholder="密码" required>
                            </div>
                            <div class="input-group">
                                <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="确认密码" required>
                            </div>
                            <div class="input-group">
                                <input type="tel" id="regPhone" name="phone" placeholder="手机号码" required>
                            </div>
                            <button type="submit">注 册</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <span>Version 1.7.0</span>
        <span class="separator">|</span>
       <!-- 版权信息 -->
<div class="copyright" style="text-align: center; padding: 10px; color: #666; font-size: 12px; margin-top: 20px;">
    © 2025 灵瞳——YOLOv8-DeepSeek多模态街景治理实时检测平台. 保留所有权利.

    <script>
        // 切换管理员和用户登录tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Login').classList.add('active');
        }

        // 切换用户登录和注册tabs
        function switchUserTab(tab) {
            document.querySelectorAll('.user-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.user-panel').forEach(panel => panel.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('user' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Panel').classList.add('active');
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 管理员登录表单提交
            document.querySelector('#adminLogin form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('adminUsername').value;
                const password = document.getElementById('adminPassword').value;
                
                if (!username || !password) {
                    alert('用户名和密码不能为空');
                    return;
                }
                
                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        isAdmin: true
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/';
                    } else {
                        alert(data.message || '登录失败，请检查用户名和密码');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('登录过程出错，请重试');
                });
            });

            // 用户登录表单提交
            document.querySelector('#userLoginPanel form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('userUsername').value;
                const password = document.getElementById('userPassword').value;
                
                if (!username || !password) {
                    alert('用户名和密码不能为空');
                    return;
                }
                
                fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        isAdmin: false
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        alert(data.message || '登录失败，请检查用户名和密码');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('登录过程出错，请重试');
                });
            });

            // 用户注册表单提交
            document.querySelector('#userRegisterPanel form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;
                const confirmPassword = document.getElementById('regConfirmPassword').value;
                const phone = document.getElementById('regPhone').value;
                
                if (!username || !password || !confirmPassword || !phone) {
                    alert('请填写所有必填项');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }
                
                fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        phone: phone
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('注册成功，请登录');
                        switchUserTab('login');
                        document.getElementById('userUsername').value = username;
                    } else {
                        alert(data.message || '注册失败');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('注册过程出错，请重试');
                });
            });
        });

        // 粒子系统
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置canvas尺寸
        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // 改进的粒子类 - 更有科技感
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1; // 增加粒子大小
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                
                // 粒子类型 - 0:圆形, 1:方形, 2:三角形
                this.type = Math.floor(Math.random() * 3);
                
                // 粒子颜色 - 白色，降低不透明度
                const colors = [
                    'rgba(255, 255, 255, 0.6)',  // 白色，增加不透明度
                    'rgba(255, 255, 255, 0.5)',  // 稍淡的白色
                    'rgba(255, 255, 255, 0.7)'   // 稍亮的白色
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // 粒子闪烁效果
                this.alpha = 0.3 + Math.random() * 0.4; // 增加基础透明度
                this.alphaChange = (Math.random() - 0.5) * 0.01;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // 边界检测
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;
                
                // 闪烁效果
                this.alpha += this.alphaChange;
                if (this.alpha <= 0.3 || this.alpha >= 0.8) {
                    this.alphaChange = -this.alphaChange;
                }
            }

            draw() {
                const colorWithAlpha = this.color.replace(/[\d\.]+\)$/g, this.alpha + ')');
                ctx.fillStyle = colorWithAlpha;
                
                // 根据粒子类型绘制不同形状
                switch(this.type) {
                    case 0: // 圆形
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 1: // 方形
                        ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                        break;
                    case 2: // 三角形
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y - this.size);
                        ctx.lineTo(this.x + this.size, this.y + this.size);
                        ctx.lineTo(this.x - this.size, this.y + this.size);
                        ctx.closePath();
                        ctx.fill();
                        break;
                }
            }
        }

        // 创建粒子数组
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // 改进的连线函数 - 更智能、更有科技感
        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const maxDistance = 150;

                    if (distance < maxDistance) {
                        const alpha = (1 - distance / maxDistance) * 0.6; // 增加连线透明度
                        
                        const gradient = ctx.createLinearGradient(
                            particles[i].x, particles[i].y,
                            particles[j].x, particles[j].y
                        );
                        
                        const color1 = particles[i].color.replace(/[\d\.]+\)$/g, alpha + ')');
                        const color2 = particles[j].color.replace(/[\d\.]+\)$/g, alpha + ')');
                        
                        gradient.addColorStop(0, color1);
                        gradient.addColorStop(1, color2);
                        
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 2; // 增加连线粗细
                        ctx.stroke();
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 更新和绘制所有粒子
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            // 绘制连线
            drawLines();
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
